name: GPU CI
run-name: "${{ inputs.node_repo }} (${{ inputs.platform }}, ${{ inputs.branch }})"

on:
  workflow_dispatch:
    inputs:
      node_repo:
        description: 'Node repo (e.g. PozzettiAndrea/ComfyUI-SAM3)'
        type: string
        required: true
      branch:
        description: 'Branch to test'
        type: string
        default: 'dev'
      platform:
        description: 'GPU platform to test'
        type: choice
        options:
          - windows-gpu
          - linux-gpu
          - windows-portable-gpu
        default: windows-gpu

env:
  PYTHONIOENCODING: utf-8
  PY313: C:\Program Files\Python313
  PY313_SCRIPTS: C:\Program Files\Python313\Scripts

jobs:
  test:
    runs-on: >-
      ${{ contains(inputs.platform, 'linux')
          && fromJson('["self-hosted","linux","cuda"]')
          || fromJson('["self-hosted","windows","cuda"]') }}
    steps:
      - name: Runner identity (debug)
        shell: powershell
        run: |
          echo "runner.name=${{ runner.name }} runner.os=${{ runner.os }} hostname=$env:COMPUTERNAME user=$(whoami)"
          echo "--- whoami /groups ---"
          whoami /groups
          echo "--- docker info raw ---"
          & 'C:\Program Files\Docker\docker.exe' info 2>&1 | Select-Object -First 30
          echo "--- end debug ---"

      - name: Install comfy-test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pip install --upgrade --break-system-packages comfy-test
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install comfy-test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "PATH=%PY313%;%PY313_SCRIPTS%;%APPDATA%\Python\Python313\Scripts;%PATH%"
          pip install --upgrade comfy-test

      - name: Run GPU tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          comfy-test dockertest \
            "https://github.com/${{ inputs.node_repo }}.git" \
            --branch "${{ inputs.branch }}" \
            --gpu \
            --logs-dir "${{ runner.temp }}/comfy-test-logs"

      - name: Run GPU tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "PATH=%PY313%;%PY313_SCRIPTS%;%APPDATA%\Python\Python313\Scripts;%PATH%"
          comfy-test dockertest "https://github.com/${{ inputs.node_repo }}.git" --branch "${{ inputs.branch }}" --gpu --logs-dir "${{ runner.temp }}\comfy-test-logs"

      - name: Publish results (Linux)
        if: always() && runner.os == 'Linux'
        shell: bash
        env:
          NODE_PAT: ${{ secrets.NODE_PAT }}
        run: |
          pip install --upgrade --break-system-packages comfy-test
          git config --global user.email "ci@scan2wall.com"
          git config --global user.name "comfy-gpu-ci"
          git config --global credential.helper store
          echo "https://x-access-token:${NODE_PAT}@github.com" > ~/.git-credentials

          sudo chown -R "$(id -u):$(id -g)" "${{ runner.temp }}/comfy-test-logs" 2>/dev/null || true

          RESULTS=$(find "${{ runner.temp }}/comfy-test-logs" -path "*/${{ inputs.branch }}/${{ inputs.platform }}/results.json" | head -1)
          if [ -z "$RESULTS" ]; then echo "No results found, skipping publish"; exit 0; fi

          comfy-test publish "$(dirname "$RESULTS")" --repo "${{ inputs.node_repo }}"

      - name: Publish results (Windows)
        if: always() && runner.os == 'Windows'
        shell: cmd
        env:
          NODE_PAT: ${{ secrets.NODE_PAT }}
        run: |
          set "PATH=%PY313%;%PY313_SCRIPTS%;%APPDATA%\Python\Python313\Scripts;%PATH%"
          pip install --upgrade comfy-test
          git config --global user.email "ci@scan2wall.com"
          git config --global user.name "comfy-gpu-ci"
          git config --global credential.helper store
          echo https://x-access-token:%NODE_PAT%@github.com> "%USERPROFILE%\.git-credentials"
          for /f "delims=" %%f in ('dir /s /b "${{ runner.temp }}\comfy-test-logs\${{ inputs.branch }}\${{ inputs.platform }}\results.json" 2^>nul') do set "RESULTS_DIR=%%~dpf"
          if not defined RESULTS_DIR (echo No results found, skipping publish & exit /b 0)
          comfy-test publish "%RESULTS_DIR%" --repo "${{ inputs.node_repo }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ inputs.platform }}
          path: ${{ runner.temp }}/comfy-test-logs/
          if-no-files-found: ignore
