name: GPU CI
run-name: "${{ inputs.node_repo }} (${{ inputs.platform }}, ${{ inputs.branch }})"

on:
  workflow_dispatch:
    inputs:
      node_repo:
        description: 'Node repo (e.g. PozzettiAndrea/ComfyUI-SAM3)'
        type: string
        required: true
      branch:
        description: 'Branch to test'
        type: string
        default: 'dev'
      platform:
        description: 'GPU platform to test'
        type: choice
        options:
          - windows-gpu
          - linux-gpu
          - windows-portable-gpu
        default: windows-gpu

jobs:
  test:
    runs-on: >-
      ${{ contains(inputs.platform, 'linux')
          && fromJson('["self-hosted","linux","cuda"]')
          || fromJson('["self-hosted","windows","cuda"]') }}
    env:
      # Extract repo name: "PozzettiAndrea/ComfyUI-SAM3" → "ComfyUI-SAM3"
      NODE_NAME: ${{ github.event.inputs.node_repo && contains(github.event.inputs.node_repo, '/') && format('{0}', github.event.inputs.node_repo) || inputs.node_repo }}
    steps:
      - name: Derive node directory name
        id: node
        shell: bash
        run: |
          FULL="${{ inputs.node_repo }}"
          NAME="${FULL##*/}"
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.node_repo }}
          ref: ${{ inputs.branch }}
          token: ${{ secrets.NODE_PAT }}
          path: ${{ steps.node.outputs.name }}

      - name: Install comfy-test
        run: pip install comfy-test

      - name: Run GPU tests
        working-directory: ${{ steps.node.outputs.name }}
        run: |
          PLATFORM="${{ inputs.platform }}"
          CT_PLATFORM="${PLATFORM%-gpu}"
          comfy-test run --platform "$CT_PLATFORM" --branch ${{ inputs.branch }} --gpu
        shell: bash
        env:
          COMFY_TEST_GPU: "1"
          COMFY_TEST_LOGS_DIR: ${{ runner.temp }}/comfy-test-logs
          COMFY_TEST_WORKSPACE_DIR: ${{ runner.temp }}/comfy-test-workspace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ inputs.platform }}
          path: ${{ runner.temp }}/comfy-test-logs/
          if-no-files-found: ignore
