name: GPU CI
run-name: "${{ inputs.node_repo }} (${{ inputs.platform }}, ${{ inputs.branch }})"

on:
  workflow_dispatch:
    inputs:
      node_repo:
        description: 'Node repo (e.g. PozzettiAndrea/ComfyUI-SAM3)'
        type: string
        required: true
      branch:
        description: 'Branch to test'
        type: string
        default: 'dev'
      platform:
        description: 'GPU platform to test'
        type: choice
        options:
          - windows-gpu
          - linux-gpu
          - windows-portable-gpu
        default: windows-gpu

jobs:
  test:
    runs-on: >-
      ${{ contains(inputs.platform, 'linux')
          && fromJson('["self-hosted","linux","cuda"]')
          || fromJson('["self-hosted","windows","cuda"]') }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Install comfy-test
        shell: bash
        run: |
          pip install --upgrade --break-system-packages comfy-test
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run GPU tests (Docker)
        shell: bash
        run: |
          comfy-test dockertest \
            "https://github.com/${{ inputs.node_repo }}.git" \
            --branch "${{ inputs.branch }}" \
            --gpu \
            --logs-dir "${{ runner.temp }}/comfy-test-logs"

      - name: Publish results to gh-pages
        if: always()
        shell: bash
        env:
          NODE_PAT: ${{ secrets.NODE_PAT }}
        run: |
          pip install --upgrade --break-system-packages comfy-test
          git config --global user.email "ci@scan2wall.com"
          git config --global user.name "comfy-gpu-ci"
          git config --global credential.helper store
          echo "https://x-access-token:${NODE_PAT}@github.com" > ~/.git-credentials

          # Docker writes files as root — fix ownership so publish can overwrite index.html
          sudo chown -R "$(id -u):$(id -g)" "${{ runner.temp }}/comfy-test-logs" 2>/dev/null || true

          RESULTS=$(find "${{ runner.temp }}/comfy-test-logs" -path "*/${{ inputs.branch }}/${{ inputs.platform }}/results.json" | head -1)
          if [ -z "$RESULTS" ]; then echo "No results found, skipping publish"; exit 0; fi

          comfy-test publish "$(dirname "$RESULTS")" --repo "${{ inputs.node_repo }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ inputs.platform }}
          path: ${{ runner.temp }}/comfy-test-logs/
          if-no-files-found: ignore
