name: GPU CI
run-name: "${{ inputs.node_repo }} (${{ inputs.platform }}, ${{ inputs.branch }})"

on:
  workflow_dispatch:
    inputs:
      node_repo:
        description: 'Node repo (e.g. PozzettiAndrea/ComfyUI-SAM3)'
        type: string
        required: true
      branch:
        description: 'Branch to test'
        type: string
        default: 'dev'
      platform:
        description: 'GPU platform to test'
        type: choice
        options:
          - windows-gpu
          - linux-gpu
          - windows-portable-gpu
        default: windows-gpu

jobs:
  test:
    runs-on: >-
      ${{ contains(inputs.platform, 'linux')
          && fromJson('["self-hosted","linux","cuda"]')
          || fromJson('["self-hosted","windows","cuda"]') }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Install comfy-test
        shell: bash
        run: |
          pip install --upgrade --break-system-packages comfy-test
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run GPU tests (Docker)
        shell: bash
        run: |
          comfy-test dockertest \
            "https://github.com/${{ inputs.node_repo }}.git" \
            --branch "${{ inputs.branch }}" \
            --gpu \
            --logs-dir "${{ runner.temp }}/comfy-test-logs"

      - name: Publish results to gh-pages
        if: always()
        shell: bash
        env:
          NODE_PAT: ${{ secrets.NODE_PAT }}
        run: |
          git config --global credential.helper '!f() { echo "username=x-access-token"; echo "password=$NODE_PAT"; }; f'
          git config --global user.email "ci@scan2wall.com"
          git config --global user.name "comfy-gpu-ci"
          comfy-test publish "${{ runner.temp }}/comfy-test-logs" --repo "${{ inputs.node_repo }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ inputs.platform }}
          path: ${{ runner.temp }}/comfy-test-logs/
          if-no-files-found: ignore
