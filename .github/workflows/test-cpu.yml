name: CPU CI
run-name: "${{ inputs.node_repo }} (${{ inputs.platform }}, ${{ inputs.branch }})"

# Thin shim — actual logic lives in comfy-test/.github/workflows/dispatch-test.yml.
# This repo is the entry point our self-hosted runners are enrolled against;
# everything else (install, cache, run, publish) is in comfy-test.

on:
  workflow_dispatch:
    inputs:
      node_repo:
        description: "Node repo (e.g. PozzettiAndrea/ComfyUI-SAM3)"
        type: string
        required: true
      branch:
        description: "Branch to test"
        type: string
        default: "dev"
      platform:
        description: "CPU platform to test"
        type: choice
        options:
          - linux-cpu
          - macos-cpu
          - macos-desktop
          - windows-cpu
          - windows-desktop
          - windows-portable-cpu
        default: linux-cpu

jobs:
  test:
    uses: PozzettiAndrea/comfy-test/.github/workflows/dispatch-test.yml@v0.3.63
    with:
      node_repo: ${{ inputs.node_repo }}
      branch: ${{ inputs.branch }}
      platform: ${{ inputs.platform }}
    secrets: inherit
